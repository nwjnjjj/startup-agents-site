<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自動化實驗系統 · 部署驗證</title>
<meta name="description" content="用來驗證 GitHub Pages 部署路徑真的通了。內容之後會被真實的產品落地頁取代。">
<style>
  :root { color-scheme: light dark; --bg:#fdfcfa; --fg:#191817; --muted:#5f5b57;
           --accent:#b4532a; --card:#ffffff; --line:#e6e1db; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141312; --fg:#f0ece7; --muted:#a29b93; --accent:#e08050;
             --card:#1e1c1a; --line:#332f2b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
          font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
          line-height:1.65; }
  .wrap { max-width:720px; margin:0 auto; padding:clamp(2rem,6vw,5rem) 1.25rem; }
  h1 { font-size:clamp(1.9rem,5vw,3rem); line-height:1.15; margin:0 0 .75rem;
        letter-spacing:-.02em; }
  .sub { font-size:clamp(1.05rem,2.4vw,1.25rem); color:var(--muted); margin:0 0 2.5rem; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px;
             padding:1.25rem 1.4rem; margin:0 0 1rem; }
  section h2 { font-size:1.05rem; margin:0 0 .4rem; letter-spacing:.01em; }
  section p { margin:0; color:var(--muted); }
  .cta { margin:2.5rem 0 0; text-align:center; }
  .cta a { display:inline-block; background:var(--accent); color:#fff; text-decoration:none;
            padding:.85rem 2rem; border-radius:8px; font-weight:600; }
  .price { margin-top:.75rem; color:var(--muted); font-size:.95rem; }
  footer { margin-top:3rem; padding-top:1.25rem; border-top:1px solid var(--line);
            color:var(--muted); font-size:.8rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>這個頁面是由排程系統自動產生並自動上線的</h1>
  <p class="sub">用來驗證 GitHub Pages 部署路徑真的通了。內容之後會被真實的產品落地頁取代。</p>
  <section><h2>為什麼有這一頁</h2><p>驗證從產生 HTML 到公開網址的整條路徑不需要人工介入。</p></section>
  <section><h2>認證方式</h2><p>使用既有的 gh CLI 認證，系統本身不持有任何密鑰。</p></section>
  <div class="cta">
    <a href="https://github.com/nwjnjjj/startup-agents-site">查看原始碼</a>
    <div class="price">現在免費搶先體驗</div>
  </div>
  <footer>由自動化實驗系統產生 · 2026-07-29</footer>
</div>
</body>
</html>
