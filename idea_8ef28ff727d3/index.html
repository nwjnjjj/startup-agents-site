  @media (prefers-color-scheme: dark) {

  section p { margin:0; color:var(--muted); }
  .cta { margin:2.5rem 0 0; text-align:center; }
  .cta a { display:inline-block; background:var(--accent); color:#fff; text-decoration:none;
            padding:.85rem 2rem; border-radius:8px; font-weight:600; }
  .price { margin-top:.75rem; color:var(--muted); font-size:.95rem; }
